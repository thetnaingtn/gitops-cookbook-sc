---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bgd
  name: bgd
  namespace: bgdk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bgd
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: bgd
    spec:
      imagePullSecrets:
        - name: github-packages-secret
      containers:
        - image: docker pull ghcr.io/thetnaingtn/grpc-course/hello-server:v0.1.0
          name: bgd
          env:
            - name: COLOR
              value: "blue"
          resources: {}
---

